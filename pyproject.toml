[project]
name = "slouka-backend"
version = "0.1.0"
description = "Slouka backend: spaced repetition learning service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.53",
    "taskiq>=0.11.9",
    "taskiq-redis>=0.5.12",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "src.main:create_app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ASYNC",
    "PT",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
