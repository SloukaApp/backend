name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads the Python version from .python-version.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy --strict src

      - name: Pytest
        shell: bash
        run: |
          status=0
          uv run --no-sync pytest || status=$?
          # Temporary allowance until the first tests are added.
          if [ "$status" -eq 5 ]; then
            echo "::warning::No tests collected. Remove this allowance when tests are added."
            exit 0
          fi
          exit "$status"
