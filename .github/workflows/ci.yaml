name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: slouka_migrations
          POSTGRES_USER: slouka_ci
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U slouka_ci -d slouka_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads the Python version from .python-version.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy --strict src

      - name: Verify migration round trip and schema consistency
        env:
          DB__DSN: postgresql+asyncpg://slouka_ci:ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/slouka_migrations
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic downgrade -1
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check

      - name: Pytest
        shell: bash
        run: |
          status=0
          uv run --no-sync pytest || status=$?
          # Temporary allowance until the first tests are added.
          if [ "$status" -eq 5 ]; then
            echo "::warning::No tests collected. Remove this allowance when tests are added."
            exit 0
          fi
          exit "$status"

  release:
    name: Release
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/release.yaml
    permissions:
      contents: read
      packages: write
    secrets:
      PROD_SSH_PASSWORD: ${{ secrets.PROD_SSH_PASSWORD }}
