name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads the Python version from .python-version.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy --strict src

      - name: Pytest
        shell: bash
        run: |
          status=0
          uv run --no-sync pytest || status=$?
          # Temporary allowance until the first tests are added.
          if [ "$status" -eq 5 ]; then
            echo "::warning::No tests collected. Remove this allowance when tests are added."
            exit 0
          fi
          exit "$status"

  publish:
    name: Publish image
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/sloukaapp/backend@${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sloukaapp/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SloukaApp/backend
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy API
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
    concurrency:
      group: slouka-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy image
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
        with:
          host: ${{ vars.PROD_SSH_HOST }}
          username: ${{ vars.PROD_SSH_USER }}
          port: ${{ vars.PROD_SSH_PORT || '22' }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          envs: BACKEND_IMAGE
          command_timeout: 20m
          script: |
            set -e
            cd /opt/slouka
            export BACKEND_IMAGE APP_ENV_FILE=/opt/slouka/production.env
            compose() {
              docker compose --project-name slouka --env-file production.env \
                -f docker-compose.yaml -f docker-compose.prod.yaml "$@"
            }
            compose pull backend migrator
            compose run --rm --no-deps migrator
            compose up -d --no-deps --wait --wait-timeout 120 backend
            curl --fail --silent --show-error --retry 5 --retry-delay 3 \
              --connect-timeout 5 --max-time 15 \
              https://api.slouka.csmmark.me/api/v1/openapi.json -o /dev/null
