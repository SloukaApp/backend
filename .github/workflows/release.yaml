name: Release

on:
  workflow_call:
    secrets:
      PROD_SSH_PASSWORD:
        required: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/sloukaapp/backend@${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sloukaapp/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SloukaApp/backend
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy API and worker
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: slouka-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy image
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.PROD_SSH_HOST }}
          username: ${{ vars.PROD_SSH_USER }}
          port: ${{ vars.PROD_SSH_PORT || '22' }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          envs: BACKEND_IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script: |
            set -e
            cd /opt/slouka
            export BACKEND_IMAGE APP_ENV_FILE=/opt/slouka/production.env
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            compose() {
              docker compose --project-name slouka --env-file production.env \
                -f docker-compose.yaml -f docker-compose.prod.yaml "$@"
            }
            compose pull backend worker migrator
            compose run --rm --no-deps migrator
            compose up -d --no-deps --wait --wait-timeout 120 backend worker
            curl --fail --silent --show-error --retry 5 --retry-delay 3 \
              --connect-timeout 5 --max-time 15 \
              https://api.slouka.csmmark.me/api/v1/openapi.json -o /dev/null
