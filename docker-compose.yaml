services:
  migrator:
    command: ["alembic", "upgrade", "head"]
    networks:
      - slouka_net
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DB__DSN: ${DB__CONTAINER_DSN:-postgresql+asyncpg://${DB__USER}:${DB__PASSWORD}@database:5432/${DB__NAME}}
    depends_on:
      database:
        condition: service_healthy

  backend:
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DB__DSN: ${DB__CONTAINER_DSN:-postgresql+asyncpg://${DB__USER}:${DB__PASSWORD}@database:5432/${DB__NAME}}
      REDIS__DSN: ${REDIS__CONTAINER_DSN:-redis://redis:6379/0}
    networks:
      - slouka_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    command: ["taskiq", "worker", "src.worker.bootstrap:broker", "--workers", "1", "--max-async-tasks", "4"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DB__DSN: ${DB__CONTAINER_DSN:-postgresql+asyncpg://${DB__USER}:${DB__PASSWORD}@database:5432/${DB__NAME}}
      REDIS__DSN: ${REDIS__CONTAINER_DSN:-redis://redis:6379/0}
    networks:
      - slouka_net

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    networks:
      - slouka_net
    volumes:
      - ./var/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: ${DB__NAME}
    networks:
      - slouka_net
    volumes:
      - ./var/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 1s
      retries: 5


networks:
  slouka_net:
    driver: bridge
