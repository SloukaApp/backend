services:
  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    networks:
      - slouka_net
    volumes:
      - ./var/pgadmin:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
  database:
    container_name: slouka_db
    ports:
      - "127.0.0.1:5432:5432"
  mailpit:
    container_name: slouka_mailpit
    networks:
      - slouka_net
    image: axllent/mailpit
    volumes:
      - ./var/mailpit:/data
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  worker:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      SMTP__HOST: mailpit
      SMTP__PORT: 1025
      SMTP__USE_TLS: "false"
      SMTP__START_TLS: "false"
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./src:/app/src

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src

networks:
  slouka_net:
    name: slouka_net
