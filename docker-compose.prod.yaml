x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrator:
    image: ${BACKEND_IMAGE:?Set an immutable GHCR digest}
    restart: "no"
    mem_limit: 384m
    cpus: 1
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?Set an immutable GHCR digest}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.5
    logging: *logging
    environment:
      APP__ENV: production
      APP__BASE_URL: https://api.slouka.csmmark.me
      APP__ALLOWED_ORIGINS: ${APP__ALLOWED_ORIGINS:-[]}
      # Only Traefik's fixed address; never the entire Docker subnet.
      APP__TRUSTED_PROXIES: '["172.30.80.2"]'
      DB__POOL_SIZE: 5
      DB__MAX_OVERFLOW: 2
      REDIS__MAX_CONNECTIONS: 5
    networks:
      slouka_net: {}
      edge: {}

  worker:
    image: ${BACKEND_IMAGE:?Set an immutable GHCR digest}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    logging: *logging
    environment:
      APP__ENV: production
      DB__POOL_SIZE: 4
      DB__MAX_OVERFLOW: 0
      REDIS__MAX_CONNECTIONS: 5
      SMTP__HOST: mail.slouka.csmmark.me
      SMTP__PORT: 465
      SMTP__USE_TLS: "true"
      SMTP__START_TLS: "false"
      SMTP__FROM_EMAIL: noreply@slouka.csmmark.me
      SMTP__USER: noreply@slouka.csmmark.me
      SMTP__PASSWORD: ${SMTP__PASSWORD:?Set noreply SMTP password}
    networks:
      slouka_net: {}
      mail: {}

  database:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    shm_size: 128m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=40"]
    logging: *logging

  redis:
    image: redis:7.4.9-bookworm
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction", "--maxclients", "50"]
    logging: *logging

  traefik:
    image: traefik:v3.7.18
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    logging: *logging
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Set ACME contact email}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --api.dashboard=false
      - --log.level=INFO
      # Access logs intentionally disabled: URLs can contain personal data.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/traefik:/etc/traefik/dynamic:ro
      - ./var/traefik/acme:/acme
    networks:
      edge:
        ipv4_address: 172.30.80.2

  stalwart:
    image: stalwartlabs/stalwart:v1.1.0
    init: true
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 2
    stop_grace_period: 60s
    logging: *logging
    environment:
      STALWART_HOSTNAME: mail.slouka.csmmark.me
      STALWART_PUBLIC_URL: https://mail.slouka.csmmark.me:8443
      TOKIO_WORKER_THREADS: 2
      STALWART_RECOVERY_MODE: ${STALWART_RECOVERY_MODE:-false}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    ports:
      - "25:25"
      - "465:465"
      - "993:993"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:443"
    volumes:
      - ./var/stalwart/etc:/etc/stalwart
      - ./var/stalwart/data:/var/lib/stalwart
    networks:
      edge: {}
      mail:
        aliases:
          - mail.slouka.csmmark.me

  roundcube:
    image: roundcube/roundcubemail:1.7.6-apache
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75
    logging: *logging
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.slouka.csmmark.me
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: ssl://mail.slouka.csmmark.me
      ROUNDCUBEMAIL_SMTP_PORT: 465
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBEMAIL_DES_KEY:?Set a persistent random 24-character key}
    volumes:
      - ./var/roundcube/db:/var/roundcube/db
      - ./deploy/roundcube/production.php:/var/roundcube/config/production.php:ro
      - ./deploy/roundcube/resources.conf:/etc/apache2/conf-enabled/slouka-resources.conf:ro
      - ./deploy/roundcube/resources.ini:/usr/local/etc/php/conf.d/slouka-resources.ini:ro
    networks:
      - edge
      - mail

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.80.0/24
  mail: {}
